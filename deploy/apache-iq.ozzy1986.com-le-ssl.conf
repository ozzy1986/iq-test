# HTTPS-vhost. Статика SPA — с диска из current/web/dist, /api — в uvicorn на 127.0.0.1:8130.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName iq.ozzy1986.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/iq.ozzy1986.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/iq.ozzy1986.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    DocumentRoot /var/www/iq.ozzy1986.com/current/web/dist
    <Directory /var/www/iq.ozzy1986.com/current/web/dist>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
        # SPA: любые пути вида /t/<id> отдают index.html, маршрут разбирает фронтенд.
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api http://127.0.0.1:8130/api retry=0 timeout=30
    ProxyPassReverse /api http://127.0.0.1:8130/api
    RequestHeader set X-Forwarded-Proto "https"

    LimitRequestBody 16384
    LimitRequestFields 50
    LimitRequestLine 4094

    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml

    # index.html не кэшируем (в нём ссылки на новые бандлы), бандлы с хэшем в имени — навсегда.
    Header set Cache-Control "no-cache"
    <Location /assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>
    <Location /api>
        Header set Cache-Control "no-store"
    </Location>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"
    # style-src-attr: React задаёт ширину прогресс-баров инлайновыми style.
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

    ErrorLog ${APACHE_LOG_DIR}/iq.ozzy1986.com_error.log
    CustomLog ${APACHE_LOG_DIR}/iq.ozzy1986.com_access.log combined
</VirtualHost>
</IfModule>
